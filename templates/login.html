<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
            width:350px;
        }

        h1{
            text-align:center;
            color:#2c3e50;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#2980b9;
        }

    </style>

</head>

<body>

<div class="login">

    <h1>🔐 Login</h1>

    <form method="POST">

        <label>Usuario</label>

        <input type="text" name="usuario">

        <label>Contraseña</label>

        <input type="password" name="password">

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
